name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check bot
      - name: Ruff format
        run: ruff format --check bot
      - name: Mypy
        run: mypy bot/app
      - name: Tests
        run: pytest bot/tests --cov=bot/app --cov-report=term-missing --cov-report=xml
      - name: Compile
        run: python -m compileall -q bot
