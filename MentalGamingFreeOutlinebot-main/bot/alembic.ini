# Alembic migration configuration for the Mental Outline VPN Platform.
#
# Usage (from the project root or bot/ directory):
#   alembic upgrade head       — apply all pending migrations
#   alembic downgrade -1       — undo the last migration
#   alembic current            — show current revision
#   alembic history            — list migration history
#   alembic revision --autogenerate -m "my_change"   — generate a new migration
#
# In production / on Replit the database URL is read from the
# BOT_DATABASE_URL / DATABASE_URL environment variable, so the
# sqlalchemy.url placeholder below is overridden at runtime by env.py.

[alembic]
script_location = %(here)s/database/migrations

# Migration filename template: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s

# Add bot/ to sys.path so `from database.base import Base` works.
prepend_sys_path = %(here)s

# Timezone for revision timestamps
timezone = UTC

[post_write_hooks]
# Optionally run black / isort here in the future.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
