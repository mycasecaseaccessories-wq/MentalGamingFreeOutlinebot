[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Mental Outline VPN Platform — a scalable commercial Telegram VPN bot"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "apscheduler==3.10.4",
    "faker>=37.0.0",
    "hypothesis>=6.130.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "python-dotenv==1.0.1",
    "python-telegram-bot[job-queue]==21.9",
    "ruff>=0.9.0",
    "sqlalchemy[asyncio]==2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.130.0",
    "faker>=37.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "black>=25.0.0",
    "isort>=5.13.0",
    "pre-commit>=4.0.0",
]

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["bot/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: pure unit tests (no I/O)",
    "integration: tests that touch the database or external systems",
    "performance: benchmark tests",
    "security: security-focused tests",
    "slow: tests that take > 1 second",
]

# ── Coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["bot/app"]
omit = [
    "bot/tests/*",
    "bot/alembic/*",
    "bot/migrations/*",
    "bot/main.py",
    "*/conftest.py",
    "*/__init__.py",
]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "bot/coverage/html"

[tool.coverage.xml]
output = "bot/coverage/coverage.xml"

# ── Ruff ───────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["bot"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations (type hints required)
    "T20",  # flake8-print (no print statements)
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PERF", # perflint
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import should be at top-level (we use lazy imports)
    "B008",    # Do not perform function calls in argument defaults (for Pydantic)
]

[tool.ruff.lint.per-file-ignores]
"bot/tests/**/*.py" = ["ANN", "S101", "PLR2004", "T20"]
"bot/alembic/**/*.py" = ["ANN", "T20"]
"bot/main.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "locales"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── Black ──────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | __pycache__
  | alembic/versions
  | \.venv
)/
'''

# ── isort ──────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "config", "locales"]
src_paths = ["bot"]

# ── Mypy ───────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["bot/app"]
exclude = [
    "bot/alembic/",
    "bot/tests/",
    "bot/migrations/",
]
